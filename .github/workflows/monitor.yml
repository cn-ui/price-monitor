name: 价格监控

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install aiohttp

      - name: 初始化数据库并添加商品
        run: |
          cd scripts
          python main.py add --source=7 \
            --id="https://v.douyin.com/wiGElh4ICQ0/" \
            --name="卟立Ex cold pro磁吸散热器" \
            --target_price=233 2>&1 || echo "商品已存在，跳过添加"

      - name: 检查价格
        run: |
          cd scripts
          python auto-check.py

      - name: 提交更新
        run: |
          git config user.name "Price Bot"
          git config user.email "bot@example.com"
          git add data/
          git diff --staged --quiet || git commit -m "自动更新价格记录 [skip ci]"
          git push
