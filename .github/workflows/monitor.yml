name: 价格监控

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5

      - name: 添加监控商品
        run: |
          uv run scripts/main.py add --source=7 \
            --id="https://v.douyin.com/wiGElh4ICQ0/" \
            --name="卟立Ex cold pro磁吸散热器" \
            --target_price=233 2>/dev/null || true

      - name: 检查价格
        run: uv run scripts/auto-check.py

      - name: 提交价格记录
        run: |
          git config user.name "Price Bot"
          git config user.email "bot@example.com"
          git add data/
          git diff --staged --quiet || git commit -m "更新价格记录 [skip ci]"
          git push
